<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mark Percentage Calculator</title>


    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" type="text/css" href="style.css">

    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">
</head>

<body style="background-color:#f5f4f2;">
  <nav class="navbar">
  <div class="container-fluid">
    <a class="navbar-brand text-white" href="index.html">
      <img src="percent.svg" alt="Logo" width="30" height="24" class="d-inline-block align-text-top text-center">
      Mark Percentage Calculator
    </a>
  </div>
</nav>

<div class="container mt-4">

  <div class="d-flex justify-content-center flex-column align-content-center">

      <h1 class="text-center mb-4 display-2">
        Mark Percentage <br>Calculator
      </h1>

      <div class="d-flex justify-content-center align-items-center flex-column">

        <form class="col-md-6" id="formid">

          <div class="input-group mr-2 ml-2 my-2">
            <input type="number" id="obtainMark" style="font-size: 1.5rem;" class="form-control text-center rounded-0 pt-2 pb-2 text-secondary focus-ring focus-ring-secondary" placeholder="Obtain Marks">
          </div>

          <div class="input-group mr-2 ml-2 my-2">
            <input type="number" id="totalMark" style="font-size: 1.5rem;" class="form-control text-center rounded-0 pt-2 pb-2 text-secondary focus-ring focus-ring-secondary" placeholder="Total Marks">
          </div>

        </form>

        <br>

        <div class="d-flex justify-content-center flex-wrap">
          <button class="btn btn-success rounded-0 m-2 "
            id="calcbtn">Calculate</button>

          <button class="btn btn-danger rounded-0 m-2" id="clear"
            onclick="window.location.reload()">Clear</button>
        </div>
      </div>

      <br>

      <div class="screen d-flex justify-content-center align-items-center">
        <span id="per" c>%</span>
      </div>

      <div class="text-center mt-3"> <p>Made with <i class="bi bi-heart-fill text-danger"></i>  By  <a href="https://jarviskumar.github.io/linkbio" class="link link-underline fw-bold"> Dipesh </a> </p> </div>
  </div>
</div>

  <script src="App.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  
</body>

</html>
